<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat App</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="intro">
      <img
        class="logo"
        src="https://mailmeteor.com/logos/assets/PNG/Google_Chat_Logo_512px.png"
        alt="logo"
      />
      <h3 class="Welcome">Welcome to chat</h3>
    </div>
    <main class="main">
      <div class="username">
        <input
          id="username_input"
          type="email"
          class="form-control"
          id="exampleFormControlInput1"
          placeholder="Enter your Username"
        />
        <button type="button" id="username_button" class="btn btn-primary">
          Save
        </button>
      </div>
      <div class="chat_box">
        <div id="messages" class="messages"></div>
        <div class="input_section">
          <input
            type="text"
            class="form-control"
            id="message_input"
            placeholder="Type your message ..."
          />

          <button id="send_message" class="btn btn-primary">Send</button>
        </div>
      </div>
    </main>
    <script src="script.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
